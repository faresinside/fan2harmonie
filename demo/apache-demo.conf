# Site virtuel de la démonstration. Traefik termine le HTTPS et parle en http à ce conteneur : il pose
# X-Forwarded-Proto: https, que public/.htaccess reconnaît (pas de boucle de redirection).
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        # Comme chez un hébergeur mutualisé : les .htaccess du site s'appliquent.
        AllowOverride All
        Require all granted
    </Directory>

    # DÉMONSTRATION : jamais indexée par les moteurs de recherche (le vrai site ne porte pas cet en-tête).
    <IfModule mod_headers.c>
        Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    </IfModule>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
