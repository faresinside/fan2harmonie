# Hôte virtuel de TEST : comme un hébergement mutualisé (racine web = dist/, .htaccess autorisés).
# « Options Indexes » est volontairement laissé actif ici : c'est public/.htaccess qui doit l'interdire.
ServerName fan2harmonie.fr

<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<VirtualHost *:80>
    DocumentRoot /var/www/html
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/test.crt
    SSLCertificateKeyFile /etc/apache2/certs/test.key
</VirtualHost>
