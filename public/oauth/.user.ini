; Réglages PHP du dossier oauth/ (relais de connexion GitHub de /admin).
; Lu par PHP-FPM et LiteSpeed (LSAPI), les modes courants des hébergements mutualisés ; PHP en module Apache
; (mod_php) l'ignore. Seuls les réglages PHP_INI_PERDIR et PHP_INI_USER y sont pris en compte : expose_php
; (PHP_INI_SYSTEM) peut donc rester sans effet. Les scripts se protègent de toute façon eux-mêmes (erreurs jamais
; affichées, en-tête X-Powered-By retiré, jeton jamais écrit si les en-têtes sont déjà partis).
; Servi au web ? Non : .htaccess refuse tout fichier dont le nom commence par un point.

display_errors=Off
log_errors=On
max_input_vars=20
expose_php=Off
