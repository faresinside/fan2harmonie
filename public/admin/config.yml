# Configuration de Sveltia CMS (espace d'administration /admin).
# Les champs correspondent exactement aux schémas Zod de src/lib/schemas.ts (vérifié par tests/unit/cms-config.test.ts).
# `repo` : dépôt GitHub « propriétaire/dépôt » du site (format vérifié par `npm run verifier:mise-en-ligne` ;
# voir docs/MISE-EN-LIGNE.md).

backend:
  name: github
  repo: faresinside/fan2harmonie
  branch: main
  # Connexion avec GitHub par le relais PHP du site lui-même (public/oauth/, hébergeur français) : Sveltia ouvre
  # une fenêtre sur https://fan2harmonie.fr/oauth/auth.php ; GitHub revient sur oauth/callback.php (adresse de
  # retour déclarée dans l'OAuth App). base_url = https://<hôte de site.url> exactement (vérifié par le
  # garde-fou de mise en ligne).
  base_url: https://fan2harmonie.fr
  auth_endpoint: oauth/auth.php

publish_mode: simple
app_title: Administration Fan 2 Harmonie
# site_url / display_url omis : par défaut l'adresse du site qui sert /admin (Sveltia exige une URL absolue).

# Noms de fichiers simples (sans accents ni guillemets), pour les actualités et les photos.
slug:
  encoding: ascii
  clean_accents: true

# Champ facultatif laissé vide : non écrit dans le fichier, pour que le site applique sa valeur par défaut
# (lieu habituel des réglages) et qu'une actualité sans photo n'ait pas de chemin d'image vide.
output:
  omit_empty_optional_fields: true

# Médias : un seul dossier, celui des photos des actualités (traitées par Astro).
media_folder: src/assets/actualites
public_folder: /src/assets/actualites
media_libraries:
  default:
    config:
      # Noms de fichiers sans espaces ni accents ; photos converties en WebP et réduites à 2000 px.
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000
  # Pas de banques d'images en ligne : seulement les photos de Stéphanie.
  stock_assets: false

collections:
  - name: rendezvous
    label: Rendez-vous
    label_singular: Rendez-vous
    description: >-
      Les séances de Qi Gong, une fiche par séance. Pour annuler une séance, cochez « Séance annulée » ;
      pour la retirer du site, supprimez-la. Les rendez-vous passés disparaissent seuls du site (dès le lendemain).
    folder: src/content/rendezvous
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: date
    # Nom du fichier : la date (AAAA-MM-JJ.md), calculée automatiquement. Deuxième séance le même jour :
    # Sveltia ajoute un suffixe (AAAA-MM-JJ-1.md), aucun fichier n'est écrasé.
    slug:
      template: '{{fields.date}}'
      editable: false
    summary: "{{date | date('DD/MM/YYYY')}} — {{heure}}{{annule | ternary(' — annulée', '')}}"
    sortable_fields:
      fields: [date]
      default:
        field: date
        direction: descending
    editor:
      preview: false
    fields:
      - name: date
        label: Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        time_format: false
        hint: Choisissez le jour de la séance dans le calendrier.
      - name: heure
        label: Heure
        widget: string
        default: '16:00'
        pattern: ['^([01]\d|2[0-3]):[0-5]\d$', 'Écrivez l’heure sous la forme 16:00']
        hint: Écrivez l’heure sous la forme 16:00 (heures, deux-points, minutes).
      - name: lieu
        label: Lieu
        widget: string
        required: false
        hint: Laissez vide pour le lieu habituel (celui de « Lieu de la pratique » dans les réglages du site), sauf si la séance a lieu ailleurs.
      - name: remarque
        label: Remarque
        widget: string
        required: false
        hint: 'Facultatif, par exemple : annulé en cas de pluie'
      - name: annule
        label: Séance annulée
        widget: boolean
        default: false
        hint: Cochez si la séance n’a pas lieu. Elle reste affichée sur le site avec la mention « Annulé ».

  - name: actualites
    label: Actualités
    label_singular: Actualité
    description: Les nouvelles de Fan 2 Harmonie, de la plus récente à la plus ancienne.
    folder: src/content/actualites
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: titre
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: "{{titre}} ({{date | date('DD/MM/YYYY')}})"
    sortable_fields:
      fields: [date, titre]
      default:
        field: date
        direction: descending
    # Photos : fichiers dans src/assets/actualites, chemin écrit relatif au fichier .md (exigé par Astro).
    media_folder: /src/assets/actualites
    public_folder: ../../assets/actualites
    editor:
      preview: false
    fields:
      - name: titre
        label: Titre
        widget: string
        maxlength: 90
        pattern: ['^.{1,90}$', 'Le titre doit faire 90 caractères au maximum']
        hint: Un titre court, 90 caractères au maximum.
      - name: date
        label: Date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        time_format: false
        hint: Date de l’actualité ; les plus récentes s’affichent en premier.
      - name: photos
        label: Photos
        label_singular: Photo
        widget: list
        required: false
        max: 12
        hint: Ajoutez autant de photos que vous voulez (12 au plus). La légende est facultative, elle décrit la photo pour les personnes qui ne la voient pas.
        fields:
          - name: image
            label: Photo
            widget: image
            choose_url: false
            accept: image/jpeg,image/png,image/webp
            hint: Une photo JPEG, PNG ou WebP, de préférence en format paysage ; elle est réduite automatiquement.
          - name: legende
            label: Légende
            widget: string
            required: false
            maxlength: 120
            hint: Facultatif. Une courte phrase qui décrit la photo, 120 caractères au maximum.
      - name: body
        label: Texte
        widget: markdown
        modes: [rich_text]
        buttons: [bold, italic, link, bulleted-list, numbered-list]
        editor_components: []
        hint: Pour passer à la ligne, laissez une ligne vide entre deux paragraphes.

  - name: pages
    label: Textes des pages
    label_singular: Texte
    description: Les textes des sections du site. On peut les corriger, mais pas en ajouter ni en supprimer.
    editor:
      preview: false
    files:
      - name: pratique
        label: La pratique
        file: src/content/pages/pratique.md
        fields: &champs_page
          - name: titre
            label: Titre de la section
            widget: string
            hint: Le titre affiché en haut de la section. C’est aussi le mot du menu (sauf si un mot plus court est choisi dans « Réglages du site », « Menu et titres »).
          - name: body
            label: Texte
            widget: markdown
            modes: [rich_text]
            buttons: [bold, italic, link, heading-three, bulleted-list, numbered-list]
            editor_components: []
            hint: Pour passer à la ligne, laissez une ligne vide entre deux paragraphes.
      - name: offres
        label: Activités proposées (page des séances)
        file: src/content/pages/offres.md
        fields:
          - name: titre
            label: Titre de la page
            widget: string
            hint: Le titre affiché en haut de la page. C’est aussi le mot du menu (sauf si un mot plus court est choisi dans « Réglages du site », « Menu et titres »).
          - name: accroche
            label: Phrase d’accroche
            widget: string
            required: false
            maxlength: 200
            hint: Une phrase courte affichée sous le titre (200 caractères au maximum). Laissez vide pour ne rien afficher.
          - name: body
            label: Texte
            widget: markdown
            modes: [rich_text]
            buttons: [bold, italic, link, heading-two, bulleted-list, numbered-list]
            editor_components: []
            hint: Chaque offre commence par un titre (bouton « Titre »). Pour passer à la ligne, laissez une ligne vide entre deux paragraphes.
      - name: qigong
        label: Le Qi Gong
        file: src/content/pages/qigong.md
        fields: *champs_page
      - name: parcours
        label: Mon parcours
        file: src/content/pages/parcours.md
        fields: *champs_page

  - name: reglages
    label: Réglages du site
    label_singular: Réglage
    description: >-
      Les textes de la page d’accueil, le lieu de la pratique, les mots du menu et les titres des sections, et les informations pour Google.
      On peut les corriger, mais pas en ajouter ni en supprimer.
    editor:
      preview: false
    files:
      - name: accueil
        label: Page d’accueil
        file: src/content/reglages/accueil.md
        fields:
          - name: accroche
            label: Phrase d’accroche
            widget: string
            maxlength: 60
            hint: La petite phrase au-dessus du titre, 60 caractères au maximum.
          - name: titre
            label: Titre
            widget: string
            maxlength: 40
            hint: Le grand titre de l’accueil, 40 caractères au maximum.
          - name: sousTitre
            label: Sous-titre
            widget: string
            maxlength: 60
            hint: Une ligne sous le titre, 60 caractères au maximum.
          - name: devise
            label: Devise
            widget: string
            maxlength: 80
            hint: La phrase en trois mots sous le sous-titre, 80 caractères au maximum.
          - name: infos
            label: Informations pratiques
            label_singular: information
            widget: list
            min: 1
            max: 5
            field:
              name: info
              label: Information
              widget: string
              maxlength: 60
              hint: Une information courte, 60 caractères au maximum.
            hint: 'Les petites lignes affichées sous la devise (par exemple : le lieu, le jour, le prix). Entre 1 et 5 lignes.'
          - name: bouton
            label: Texte du bouton
            widget: string
            maxlength: 30
            hint: Le texte du bouton qui mène aux rendez-vous, 30 caractères au maximum.
          - name: bienfaits
            label: Les bienfaits
            label_singular: bienfait
            widget: list
            min: 1
            max: 6
            summary: '{{libelle}}'
            fields:
              - name: icone
                label: Dessin
                widget: select
                default: souffle
                options:
                  - { label: Souffle, value: souffle }
                  - { label: Lotus, value: lotus }
                  - { label: Silhouette, value: silhouette }
                  - { label: Yin et yang, value: yinyang }
                hint: Le petit dessin affiché à côté du bienfait.
              - name: libelle
                label: Texte
                widget: string
                maxlength: 60
                hint: Un bienfait en quelques mots, 60 caractères au maximum.
            hint: Les bienfaits de la pratique affichés sur l’accueil. Entre 1 et 6.
      - name: lieu
        label: Lieu de la pratique (paragraphe « Le lieu »)
        file: src/content/reglages/lieu.md
        fields:
          - name: nom
            label: Nom du lieu
            widget: string
            maxlength: 120
            hint: Le lieu tel qu’il est affiché, 120 caractères au maximum.
          - name: latitude
            label: Latitude
            widget: number
            value_type: float
            min: -90
            max: 90
            hint: Un nombre avec des décimales, par exemple 48.64703. Dans Google Maps, un clic droit sur le lieu donne ces deux nombres.
          - name: longitude
            label: Longitude
            widget: number
            value_type: float
            min: -180
            max: 180
            hint: Un nombre avec des décimales, par exemple 1.811268 (le deuxième nombre donné par Google Maps).
          - name: body
            label: Indications pour s’y rendre
            widget: markdown
            required: false
            modes: [rich_text]
            buttons: [bold, italic, link, bulleted-list]
            editor_components: []
            hint: Pour passer à la ligne, laissez une ligne vide entre deux paragraphes.
      - name: menu
        label: Menu et titres
        file: src/content/reglages/menu.md
        fields:
          - name: rdv
            label: Lien « Rendez-vous » du menu
            widget: string
            maxlength: 30
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Le mot affiché dans la barre de menu pour aller à la section des rendez-vous, 30 caractères au maximum. La section visée ne change pas (l’ordre se règle plus bas, « Ordre des liens du menu »).
          - name: pratique
            label: Mot du menu pour « La pratique » (facultatif)
            widget: string
            required: false
            maxlength: 30
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Laissez VIDE, le menu reprend alors le titre de la page (rubrique « Textes des pages »), il n’y a rien d’autre à changer. N’écrivez un mot ici que pour avoir dans le menu un mot plus court que le titre, 30 caractères au maximum.
          - name: offres
            label: Mot du menu pour la page des séances (facultatif)
            widget: string
            required: false
            maxlength: 30
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Laissez VIDE, le menu reprend alors le titre de la page (rubrique « Textes des pages »), il n’y a rien d’autre à changer. N’écrivez un mot ici que pour avoir dans le menu un mot plus court que le titre, 30 caractères au maximum.
          - name: qigong
            label: Mot du menu pour « Le Qi Gong » (facultatif)
            widget: string
            required: false
            maxlength: 30
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Laissez VIDE, le menu reprend alors le titre de la page (rubrique « Textes des pages »), il n’y a rien d’autre à changer. N’écrivez un mot ici que pour avoir dans le menu un mot plus court que le titre, 30 caractères au maximum.
          - name: qui
            label: Mot du menu pour « Qui est Fan 2 Harmonie » (facultatif)
            widget: string
            required: false
            maxlength: 30
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Laissez VIDE, le menu reprend alors le titre de la page (rubrique « Textes des pages »), il n’y a rien d’autre à changer. N’écrivez un mot ici que pour avoir dans le menu un mot plus court que le titre, 30 caractères au maximum.
          - name: actualites
            label: Lien « Actualités » du menu
            widget: string
            maxlength: 30
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Le mot affiché dans la barre de menu pour aller à la section des actualités (le lien disparaît s’il n’y a aucune actualité), 30 caractères au maximum. La section visée ne change pas (l’ordre se règle plus bas, « Ordre des liens du menu »).
          - name: contact
            label: Lien « Contact » du menu
            widget: string
            maxlength: 30
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Le mot affiché dans la barre de menu pour aller au formulaire de contact, 30 caractères au maximum. La section visée ne change pas (l’ordre se règle plus bas, « Ordre des liens du menu »).
          - name: titreRdv
            label: Titre de la section « Prochains rendez-vous »
            widget: string
            maxlength: 60
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Le titre affiché en haut de la section des rendez-vous, 60 caractères au maximum.
          - name: titreActualites
            label: Titre de la section « Actualités »
            widget: string
            maxlength: 60
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Le titre affiché en haut de la section des actualités, 60 caractères au maximum.
          - name: titreContact
            label: Titre de la section « Contactez-moi »
            widget: string
            maxlength: 60
            pattern: ['\S', 'Écrivez au moins un caractère visible.']
            hint: Le titre affiché en haut de la section du formulaire de contact, 60 caractères au maximum.
          - name: ordre
            label: Ordre des liens du menu
            widget: list
            required: false
            allow_add: false
            allow_remove: false
            min: 7
            max: 7
            default: [rdv, offres, pratique, qigong, actualites, qui, contact]
            hint: Pour changer l’ordre du menu, attrapez un lien par sa poignée (les petits points à gauche) et faites-le glisser à sa nouvelle place. Le premier de la liste est le premier lien du menu.
            field:
              name: lien
              label: Lien
              widget: select
              options:
                - { label: Rendez-vous, value: rdv }
                - { label: Activités proposées (page des séances), value: offres }
                - { label: La pratique, value: pratique }
                - { label: Le Qi Gong, value: qigong }
                - { label: Actualités, value: actualites }
                - { label: Qui est Fan 2 Harmonie, value: qui }
                - { label: Contact, value: contact }
      - name: textes
        label: Petits textes du site
        file: src/content/reglages/textes.md
        fields:
          - name: rdv
            label: Section « Rendez-vous »
            widget: object
            collapsed: true
            hint: Les petits textes autour de la liste des dates (les dates elles-mêmes se gèrent dans « Rendez-vous », à gauche).
            fields:
              - name: accent
                label: Petit mot au-dessus du titre
                widget: string
                required: false
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le petit mot écrit à la main au-dessus du titre, 40 caractères au maximum. Laissez vide pour ne rien afficher.
              - name: aucuneDate
                label: Message quand il n’y a aucune date
                widget: string
                maxlength: 60
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Affiché quand aucun rendez-vous n’est prévu, 60 caractères au maximum.
              - name: prochain
                label: Étiquette du prochain rendez-vous
                widget: string
                maxlength: 30
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Affichée sur la première date à venir, 30 caractères au maximum.
              - name: annule
                label: Mention d’une séance annulée
                widget: string
                maxlength: 20
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Affichée sur une séance annulée, 20 caractères au maximum.
              - name: lienPratique
                label: Lien vers « La pratique »
                widget: string
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le lien sous les dates qui mène à la section « La pratique », 40 caractères au maximum.
              - name: lienContact
                label: Lien vers le contact
                widget: string
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le lien sous les dates qui mène au formulaire de contact, 40 caractères au maximum.
          - name: pratique
            label: Section « La pratique » et le lieu
            widget: object
            collapsed: true
            hint: Le texte de la section se modifie dans « Textes des pages ». Le paragraphe du lieu (comment s’y rendre) se modifie dans « Lieu de la pratique ».
            fields:
              - name: accent
                label: Petit mot au-dessus du titre
                widget: string
                required: false
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le petit mot écrit à la main au-dessus du titre, 40 caractères au maximum. Laissez vide pour ne rien afficher.
              - name: titreLieu
                label: Titre du paragraphe du lieu
                widget: string
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le titre au-dessus des indications pour venir (« Le lieu »), 40 caractères au maximum.
              - name: lienCarte
                label: Texte du lien vers la carte
                widget: string
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le lien qui ouvre le lieu dans Google Maps, 40 caractères au maximum.
          - name: qigong
            label: Section « Le Qi Gong »
            widget: object
            collapsed: true
            hint: Le texte de la section se modifie dans « Textes des pages ».
            fields:
              - name: accent
                label: Petit mot au-dessus du titre
                widget: string
                required: false
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le petit mot écrit à la main au-dessus du titre, 40 caractères au maximum. Laissez vide pour ne rien afficher.
          - name: actualites
            label: Section « Actualités »
            widget: object
            collapsed: true
            hint: Les actualités elles-mêmes se gèrent dans « Actualités », à gauche.
            fields:
              - name: accent
                label: Petit mot au-dessus du titre
                widget: string
                required: false
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le petit mot écrit à la main au-dessus du titre, 40 caractères au maximum. Laissez vide pour ne rien afficher.
          - name: qui
            label: Section « Qui est Fan 2 Harmonie »
            widget: object
            collapsed: true
            hint: Le texte de la section se modifie dans « Textes des pages ».
            fields:
              - name: accent
                label: Petit mot au-dessus du titre
                widget: string
                required: false
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le petit mot écrit à la main au-dessus du titre, 40 caractères au maximum. Laissez vide pour ne rien afficher.
          - name: contact
            label: Section « Contact »
            widget: object
            collapsed: true
            hint: La case à cocher sur les données personnelles et les messages d’erreur restent fixes (obligations légales).
            fields:
              - name: accent
                label: Petit mot au-dessus du titre
                widget: string
                required: false
                maxlength: 40
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le petit mot écrit à la main au-dessus du titre, 40 caractères au maximum. Laissez vide pour ne rien afficher.
              - name: invitation
                label: Phrase d’invitation
                widget: string
                maxlength: 100
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: La phrase à côté du formulaire, 100 caractères au maximum.
              - name: reponse
                label: Phrase sur la réponse
                widget: string
                maxlength: 100
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: La phrase sous l’invitation, 100 caractères au maximum.
              - name: libelleEmail
                label: Texte devant l’adresse e-mail
                widget: string
                maxlength: 30
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Affiché devant l’adresse e-mail de contact, 30 caractères au maximum.
              - name: bouton
                label: Bouton d’envoi
                widget: string
                maxlength: 30
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le texte du bouton qui envoie le message, 30 caractères au maximum.
              - name: merci
                label: Message après l’envoi
                widget: string
                maxlength: 150
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Affiché quand le message est bien parti, 150 caractères au maximum.
          - name: activites
            label: Page « Activités proposées »
            widget: object
            collapsed: true
            hint: Le titre et le texte de la page se modifient dans « Textes des pages ».
            fields:
              - name: bouton
                label: Bouton en bas de la page
                widget: string
                maxlength: 30
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le bouton qui ramène à l’accueil, 30 caractères au maximum.
              - name: descriptionGoogle
                label: Description dans Google
                widget: string
                minlength: 50
                maxlength: 160
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Le texte affiché sous le titre de la page dans les résultats Google, entre 50 et 160 caractères.
          - name: piedDePage
            label: Pied de page
            widget: object
            collapsed: true
            hint: Le bas de chaque page. Le lien « Mentions légales » reste fixe.
            fields:
              - name: signature
                label: Phrase après « Fan 2 Harmonie »
                widget: string
                maxlength: 60
                pattern: ['\S', 'Écrivez au moins un caractère visible.']
                hint: Affichée en bas de chaque page après « Fan 2 Harmonie · », 60 caractères au maximum.
      - name: referencement
        label: Référencement Google
        file: src/content/reglages/referencement.md
        fields:
          - name: titre
            label: Titre dans Google
            widget: string
            minlength: 10
            maxlength: 70
            hint: Le titre affiché dans les résultats de recherche, de 10 à 70 caractères.
          - name: description
            label: Description dans Google
            widget: text
            minlength: 50
            maxlength: 170
