; Réglages PHP du dossier api/ (script de contact).
; Lu par PHP-FPM et LiteSpeed (LSAPI), les modes courants des hébergements mutualisés ; PHP en module Apache
; (mod_php) l'ignore. Seuls les réglages PHP_INI_PERDIR et PHP_INI_USER y sont pris en compte : expose_php et
; file_uploads (PHP_INI_SYSTEM) peuvent donc rester sans effet. Le script se protège de toute façon lui-même
; (en-tête X-Powered-By retiré, fichiers joints refusés en 413, erreurs jamais affichées).
; Servi au web ? Non : .htaccess refuse tout fichier dont le nom commence par un point.

display_errors=Off
log_errors=On
expose_php=Off
file_uploads=Off
post_max_size=64K
max_input_vars=50
max_execution_time=10
memory_limit=32M
