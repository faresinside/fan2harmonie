# Construction et mise en ligne du site chez l'hébergeur français (FTPS ou SFTP, avec lftp).
#
# En clair : à chaque modification de la branche main (y compris un rendez-vous, une actualité ou un texte
# enregistré dans /admin, qui sont des fichiers .md de src/content/), chaque nuit, ou à la demande, GitHub
# construit le site puis copie le dossier dist/ sur l'hébergement. Le site est statique : les rendez-vous
# passés disparaissent seulement quand le site est reconstruit, d'où la reconstruction de chaque nuit. Rien
# d'autre ne passe par GitHub : le formulaire de contact est traité par l'hébergeur (api/contact.php), aucune
# donnée de visiteur ne quitte la France. Seules les modifications de docs/ et des fichiers .md à la racine
# du dépôt (README…) ne déclenchent rien.
#
# Deux jobs :
#   1. « construire », SANS aucun secret : tests unitaires → garde-fou de mise en ligne (bloque tant qu'une
#      valeur provisoire subsiste) → construction → contrôle de dist/ → dist/ mis de côté (artefact).
#   2. « deployer », seulement depuis main, dans l'environnement GitHub « production » (qui détient les
#      secrets), sans Node ni npm : scripts/deployer.sh (paramètres de connexion, REMOTE_PATH, fichier témoin sur
#      le serveur, passage à blanc qui compte les suppressions, copie) → le site répond-il ?
# Si une étape échoue, rien n'est copié et le site en ligne reste tel quel.
#
# Revenir à une version précédente :
#   - durablement : « git revert » du ou des commits fautifs sur main (le site est reconstruit aussitôt) ;
#   - en urgence seulement : Actions > « Déploiement » > Run workflow DEPUIS main, champ « ref » = SHA complet
#     (40 caractères) d'un ancien commit de main. Cette mise en ligne est provisoire : le prochain push ou la
#     reconstruction de la nuit remet la dernière version de main.
#
# Secrets à créer dans l'environnement « production » (Settings > Environments > production, limité à la
# branche main), jamais écrits dans le dépôt :
#   DEPLOY_PROTOCOL     ftps ou sftp (jamais « ftp » seul : le mot de passe passerait en clair)
#   DEPLOY_HOST         nom du serveur FTP / SFTP de l'hébergeur
#   DEPLOY_USER         compte FTP / SFTP
#   DEPLOY_PASSWORD     mot de passe de ce compte
#   DEPLOY_PORT         port (vide = 21 en FTPS, 22 en SFTP)
#   REMOTE_PATH         dossier de la racine web, RELATIF à la racine du compte (chez OVH : www)
#   DEPLOY_KNOWN_HOSTS  SFTP seulement : empreinte du serveur, une ligne de known_hosts (vérifiée : jamais d'acceptation
#                       aveugle) ; vide en FTPS (le certificat du serveur est alors vérifié avec les autorités du système)
# Et, une fois pour toutes, À LA MAIN sur le serveur : un fichier vide « .fan2harmonie-site » dans REMOTE_PATH
# (fichier témoin : sans lui, rien n'est copié ni supprimé).
name: Déploiement

on:
  push:
    branches: [main]
    # « * » ne traverse pas « / » : seuls les .md de la RACINE sont ignorés ; ceux de src/content/ déploient.
    paths-ignore:
      - 'docs/**'
      - '*.md'
  schedule:
    # GitHub planifie en UTC ; Paris est à UTC+2 en été, UTC+1 en hiver. 22:10 UTC = 00:10 à Paris en été,
    # 23:10 UTC = 00:10 à Paris en hiver : l'une des deux tombe toujours juste après minuit à Paris, quelle
    # que soit l'heure d'été (l'autre fait une reconstruction de plus, sans effet gênant).
    - cron: '10 22 * * *'
    - cron: '10 23 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Urgence seulement : SHA complet (40 caractères) d’un commit de main à remettre en ligne ; vide = dernière version de main'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      adresse: ${{ steps.adresse.outputs.adresse }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choisir la version
        id: version
        env:
          REF_DEMANDEE: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Script lu sur la version de main qui lance le workflow, avant tout changement de version.
          cp scripts/valider-ref.sh "$RUNNER_TEMP/valider-ref.sh"
          ref=$(bash "$RUNNER_TEMP/valider-ref.sh" syntaxe "$REF_DEMANDEE")
          if [ -n "$REF_DEMANDEE" ]; then
            if [ "$ref" = main ]; then
              git checkout -q --detach origin/main
            else
              git checkout -q --detach "$ref"
            fi
            bash "$RUNNER_TEMP/valider-ref.sh" ancetre
          fi
          echo "version=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version construite : $(git rev-parse HEAD)"

      - name: Installer Node.js (version de .node-version)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Garde-fou de mise en ligne
        run: npm run verifier:mise-en-ligne

      - name: Aucune variable de test à la construction
        run: |
          set -euo pipefail
          # Variables réservées aux tests et aux aperçus : elles changeraient l'adresse ou le contenu du site.
          if ! test -z "${ASTRO_BASE:-}${AUDIT_SITE_URL:-}${CONTENT_FIXTURE:-}${CONTENT_FIXTURE_SET:-}"; then
            echo "::error::ASTRO_BASE, AUDIT_SITE_URL, CONTENT_FIXTURE et CONTENT_FIXTURE_SET doivent être vides pour la mise en ligne."
            exit 1
          fi

      - name: Construire le site
        run: npm run build

      - name: Contrôler le dossier construit
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.htaccess
          test -f dist/api/.htaccess
          test -f dist/api/contact.php
          test -f dist/oauth/.htaccess
          test -f dist/oauth/.user.ini
          test -f dist/oauth/auth.php
          test -f dist/oauth/callback.php
          test -f dist/oauth/lib/oauth.php
          # Jamais de fichier propre au serveur dans dist/ (il écraserait celui de l'hébergement).
          for interdit in dist/api/config.php dist/oauth/config.php dist/.htpasswd dist/error_log dist/api/error_log dist/.fan2harmonie-site; do
            if [ -e "$interdit" ]; then
              echo "::error::$interdit ne doit pas être construit."
              exit 1
            fi
          done
          # Aucun lien symbolique (il pourrait désigner un fichier du serveur hors du site).
          if [ -n "$(find dist -type l -print -quit)" ]; then
            echo "::error::lien symbolique dans dist/."
            exit 1
          fi

      # Contenu écrit dans /admin et documentation : contrôlés, mais JAMAIS bloquants (un contenu imparfait ou une
      # retouche du README ne doit pas empêcher la mise en ligne) : un avertissement apparaît dans le résumé.
      - name: Contrôle du contenu (non bloquant)
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! npm run verifier:contenu; then
            echo "::warning::Contrôle du contenu en échec (voir ci-dessus) : la mise en ligne continue."
            exit 1
          fi

      - name: Tests de la documentation (non bloquants)
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! npm run test:docs; then
            echo "::warning::Tests de la documentation en échec : la mise en ligne continue."
            exit 1
          fi

      - name: Adresse du site (src/config/site.ts)
        id: adresse
        run: |
          set -euo pipefail
          adresse=$(node --input-type=module -e "const { site } = await import('./src/config/site.ts'); console.log(new URL('/', site.url).href)")
          echo "adresse=$adresse" >> "$GITHUB_OUTPUT"

      - name: Mettre dist/ de côté
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist/
          # .htaccess, api/.htaccess, api/.user.ini, oauth/.htaccess et oauth/.user.ini commencent par un point :
          # à inclure explicitement.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deployer:
    needs: construire
    # Jamais depuis une autre branche (un lancement manuel ailleurs construit sans rien mettre en ligne).
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Récupérer les scripts de déploiement (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Récupérer dist/
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist

      - name: Installer lftp
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Préparer la vérification du serveur (SFTP)
        env:
          DEPLOY_PROTOCOL: ${{ secrets.DEPLOY_PROTOCOL }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # En SFTP, l'empreinte du serveur vient du secret : jamais d'acceptation aveugle.
          if [ "$DEPLOY_PROTOCOL" = sftp ]; then
            if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
              echo "::error::Secret DEPLOY_KNOWN_HOSTS requis en SFTP."
              exit 1
            fi
            umask 077
            mkdir -p "$RUNNER_TEMP/ssh"
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
            chmod 0600 "$RUNNER_TEMP/ssh/known_hosts"
          fi

      - name: Copier dist/ sur l'hébergement (lftp)
        env:
          DEPLOY_PROTOCOL: ${{ secrets.DEPLOY_PROTOCOL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          VERSION: ${{ needs.construire.outputs.version }}
        run: |
          set -euo pipefail
          # Contrôle des paramètres, fichier témoin, passage à blanc, copie : tout est dans scripts/deployer.sh
          # (testé contre un vrai serveur FTPS et un vrai serveur SFTP : dossier tests/ftp).
          if [ "$DEPLOY_PROTOCOL" = sftp ]; then
            export DEPLOY_KNOWN_HOSTS="$RUNNER_TEMP/ssh/known_hosts"
          else
            unset DEPLOY_KNOWN_HOSTS
          fi
          bash scripts/deployer.sh

      # Aussitôt la copie terminée (réussie ou non) : l'empreinte du serveur ne sert plus.
      - name: Effacer les fichiers temporaires (après la copie)
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

      - name: Vérifier que le site répond
        env:
          ADRESSE: ${{ needs.construire.outputs.adresse }}
        run: |
          set -euo pipefail
          # Adresse calculée par le job « construire » : forme exacte exigée avant tout usage.
          [[ "$ADRESSE" =~ ^https://[a-z0-9.-]+/$ ]] || exit 1
          statut=$(curl -sS -o /dev/null -w '%{http_code}' -I --max-time 20 -- "$ADRESSE") || statut=000
          case "$statut" in
            000) echo "::warning::$ADRESSE ne répond pas encore (nom de domaine pas encore pointé vers l'hébergeur ?)." ;;
            5[0-9][0-9]) echo "::error::$ADRESSE répond par une erreur du serveur ($statut) : vérifier le site et les .htaccess."
              exit 1 ;;
            2[0-9][0-9]|3[0-9][0-9]) echo "Le site répond : $ADRESSE ($statut)" ;;
            *) echo "::warning::$ADRESSE répond $statut." ;;
          esac

      - name: Effacer les fichiers temporaires (filet de sécurité en fin de job)
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
