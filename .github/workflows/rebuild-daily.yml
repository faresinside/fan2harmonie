# Reconstruction quotidienne du site.
#
# Pourquoi : le site est statique. Les rendez-vous « passés » sont retirés au moment de la construction
# du site, pas dans le navigateur. Sans nouvelle construction, un rendez-vous d'hier resterait affiché.
# Chaque nuit, ce workflow appelle donc le « deploy hook » de Cloudflare Pages, qui reconstruit et republie
# le site à partir de la branche main.
#
# Horaires : GitHub planifie en UTC, Paris est à UTC+2 en été et UTC+1 en hiver. Deux exécutions :
#   - 22:10 UTC = 00:10 à Paris en été   (23:10 en hiver : sans effet utile, sans danger) ;
#   - 23:10 UTC = 00:10 à Paris en hiver (01:10 en été : simple reconstruction de plus).
# L'une des deux tombe donc toujours juste après minuit à Paris. GitHub peut retarder une exécution
# planifiée de quelques minutes, parfois davantage : sans conséquence ici.
#
# Secret requis (Settings > Secrets and variables > Actions) : CLOUDFLARE_DEPLOY_HOOK = adresse du deploy hook
# « rebuild-quotidien » du projet Cloudflare Pages (voir docs/MISE-EN-LIGNE.md). Jamais écrite dans le dépôt.
name: Reconstruction quotidienne

on:
  schedule:
    - cron: '10 22 * * *'
    - cron: '10 23 * * *'
  workflow_dispatch:

# Le jeton GitHub n'a besoin d'aucun droit : seul le secret est utilisé.
permissions: {}

concurrency:
  group: reconstruction-quotidienne
  cancel-in-progress: false

jobs:
  reconstruire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Déclencher la reconstruction Cloudflare Pages
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if ! test -n "$DEPLOY_HOOK_URL"; then
            echo "::error::Secret CLOUDFLARE_DEPLOY_HOOK absent ou vide : voir docs/MISE-EN-LIGNE.md"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" -o /dev/null
          echo "Reconstruction demandée à Cloudflare Pages."
