services:
  app:
    build: .
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - fan2harmonie_node_modules:/app/node_modules
    ports:
      - "4321:4321"
      - "4322:4322"
    ipc: host
    command: npm run dev -- --host 0.0.0.0

  # PHP du script de contact (public/api/) : tests seulement (`docker compose run --rm php php tests/php/run.php`).
  # Aucun accès réseau : le test d'intégration parle au serveur PHP intégré sur la boucle locale du conteneur.
  php:
    image: php:8.3-cli
    working_dir: /app
    network_mode: none
    volumes:
      - .:/app

  # Même suite sur la plus ancienne version de PHP acceptée par le script (8.1) :
  # `docker compose run --rm php81 php tests/php/run.php`.
  php81:
    image: php:8.1-cli
    working_dir: /app
    network_mode: none
    volumes:
      - .:/app

volumes:
  fan2harmonie_node_modules:
