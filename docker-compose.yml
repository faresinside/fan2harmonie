services:
  app:
    build: .
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - fan2harmonie_node_modules:/app/node_modules
    ports:
      - "4321:4321"
      - "4322:4322"
    ipc: host
    command: npm run dev -- --host 0.0.0.0

  # PHP du script de contact (public/api/) : tests seulement (`docker compose run --rm php php tests/php/run.php`).
  # Aucun accès réseau : le test d'intégration parle au serveur PHP intégré sur la boucle locale du conteneur.
  php:
    image: php:8.3-cli
    working_dir: /app
    network_mode: none
    volumes:
      - .:/app

  # Même suite sur la plus ancienne version de PHP acceptée par le script (8.1) :
  # `docker compose run --rm php81 php tests/php/run.php`.
  php81:
    image: php:8.1-cli
    working_dir: /app
    network_mode: none
    volumes:
      - .:/app

  # Vrai Apache 2.4 + PHP 8.3 servant dist/ (avec ses .htaccess), comme l'hébergeur : `npm run test:apache`,
  # après `npm run build`. Profil « apache » : jamais lancé par un simple `docker compose up`.
  # Réseau interne sans accès à Internet. Configuration du formulaire de TEST : tests/apache/config-test.php,
  # copiée hors de la racine web et désignée par FAN2HARMONIE_CONFIG (jamais dans public/ ni dist/).
  apache:
    profiles: [apache]
    build: tests/apache
    image: fan2harmonie-apache-test:local
    environment:
      - FAN2HARMONIE_CONFIG=/srv/fan2harmonie-test/config.php
      - MAIL_TRANSPORT=file
    volumes:
      - ./dist:/dist:ro
      - ./tests/apache:/tests:ro
    networks: [apache-test]
    healthcheck: &sante-apache
      test: ["CMD", "curl", "-sk", "-o", "/dev/null", "https://localhost/"]
      interval: 1s
      timeout: 5s
      retries: 60

  # Même serveur privé d'un module : sans mod_rewrite, tout doit échouer (500) plutôt que servir sans refus ;
  # sans mod_headers, les refus doivent rester actifs.
  apache-sans-rewrite:
    profiles: [apache]
    image: fan2harmonie-apache-test:local
    pull_policy: never
    environment:
      - DESACTIVER_MODULE=rewrite
    volumes:
      - ./dist:/dist:ro
      - ./tests/apache:/tests:ro
    networks: [apache-test]
    healthcheck: *sante-apache

  apache-sans-headers:
    profiles: [apache]
    image: fan2harmonie-apache-test:local
    pull_policy: never
    environment:
      - DESACTIVER_MODULE=headers
    volumes:
      - ./dist:/dist:ro
      - ./tests/apache:/tests:ro
    networks: [apache-test]
    healthcheck: *sante-apache

  # Les requêtes de test (tests/apache/run.sh, curl) contre le service « apache ».
  apache-tests:
    profiles: [apache]
    image: fan2harmonie-apache-test:local
    pull_policy: never
    depends_on:
      apache:
        condition: service_healthy
      apache-sans-rewrite:
        condition: service_healthy
      apache-sans-headers:
        condition: service_healthy
    entrypoint: ["sh", "/tests/run.sh"]
    volumes:
      - ./dist:/dist:ro
      - ./tests/apache:/tests:ro
    networks: [apache-test]

networks:
  apache-test:
    internal: true

volumes:
  fan2harmonie_node_modules:
